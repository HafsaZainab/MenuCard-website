<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spice Corner — Menu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <span class="logo">Spice Corner</span>
    <ul>
      <li><a href="#menu">Menu</a></li>
    </ul>
  </nav>

  <header>
    <h1>Our Menu</h1>
    <p>Fresh food, made with love.</p>
  </header>

  <main id="menu" class="menu">
    <div class="card"><img src="images/biryani.jpg" alt="Chicken Biryani">
      <div>
        <h3>Chicken Biryani</h3>
        <h4>Rs. 650</h4>
      </div>
    </div>
    <div class="card"><img src="images/burger.jpg" alt="Beef Burger"><div><h3>Beef Burger &amp; Fries</h3><h4>Rs. 850</h4></div></div>

    <div class="card"><img src="images/pasta.jpg" alt="Tomato Pasta"><div><h3>Tomato Basil Pasta</h3><h4>Rs. 900</h4></div></div>
    <div class="card"><img src="images/lava-cake.jpg" alt="Lava Cake"><div><h3>Chocolate Lava Cake</h3><h4>Rs. 550</h4></div></div>
    <div class="card"><img src="images/mango-shake.jpg" alt="Mango Shake"><div><h3>Mango Shake</h3><h4>Rs. 350</h4></div></div>

</html>
